name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build once per OS so every interpreter tests the same stable ABI artifact.
  wheel:
    name: Build abi3 wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Sync dev environment
        run: uv sync --locked --dev --python 3.12
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple

      - name: Build stable ABI wheel
        run: uv run --locked maturin build --locked --release --out dist --interpreter python
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  # Install the built wheel in clean environments without building the source tree.
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          # Use an isolated environment to exercise the wheel rather than editable sources.
          uv venv --python ${{ matrix.python }}
          uv pip install --index-url https://pypi.org/simple dist/*.whl 'pytest>=8.4'

      - name: Run test suite against installed wheel
        run: uv run --no-project python -m pytest -q

  stub-check:
    name: Stub Sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust 1.88.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Regenerate typing stubs
        run: python create_typing.py

      - name: Verify checked-in stub is current
        run: git diff --exit-code -- python/a2lfile/_a2lfile.pyi
